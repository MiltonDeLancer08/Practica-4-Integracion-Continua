name: Alerta
 
on:
  push:
    branches:
      - main
 
jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
 
      - name: Ejecutar hola mundo
        run: node index.js
 
      - name: Enviar notificación a ntfy
        run: curl -d "Nuevo push a main" ntfy.sh/devops-itla
 
